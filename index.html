<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMEZarrTileSource</title>
  </head>

  <body>
    <h1>OMEZarrTileSource</h1>
    <div id="viewer" style="width: 1280px; height: 1024px"></div>
    <script type="module">
      import OpenSeadragon from "openseadragon";

      // import { OMEZarrTileSource } from "omezarr-tilesource";
      import { OMEZarrTileSource } from "/src/OMEZarrTileSource.js";

      OMEZarrTileSource.enable(OpenSeadragon);

      const searchParams = new URLSearchParams(window.location.search);

      const url = searchParams.get("url");
      if (url === null) {
        throw new Error("Missing mandatory URL parameter 'url'");
      }

      let t = searchParams.get("t") ?? undefined;
      if (t !== undefined) {
        t = Number(t);
      }

      let z = searchParams.get("z") ?? undefined;
      if (z !== undefined) {
        z = Number(z);
      }

      let c = searchParams.getAll("c");
      if (c.length > 0) {
        c = c.map((c) => Number(c));
      } else {
        c = undefined;
      }

      new OpenSeadragon.Viewer({
        id: "viewer",
        tileSources: { type: "ome-zarr", url, t, z, c },
        prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
        timeout: 60000, // increase timeout for large images,
        minZoomImageRatio: 0, // allow zooming out indefinitely
        maxZoomPixelRatio: Infinity, // allow zooming in indefinitely
      });
    </script>
  </body>
</html>
